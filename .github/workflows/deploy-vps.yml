name: Deploy Web App to VPS

on:
  workflow_dispatch:
    inputs:
      release_manifest:
        description: Optional release-manifest JSON; repository SHA must match protected main
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-vps.yml"
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.js"
      - "tsconfig.json"
      - "tsconfig.app.json"
      - "tsconfig.node.json"
      - "vite.config.ts"
      - "jest.config.cjs"
      - "deploy/**"
      - ".env.production.example"

permissions:
  contents: read

concurrency:
  group: vps-web-production
  cancel-in-progress: true

env:
  REMOTE_PATH: /opt/pm-web

jobs:
  deploy-source-gate:
    name: deploy-source-gate
    runs-on: ubuntu-latest
    outputs:
      deploy_source: ${{ steps.gate.outputs.deploy_source }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Validate deployment source
        id: gate
        shell: bash
        env:
          RELEASE_MANIFEST: ${{ github.event.inputs.release_manifest || '' }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Production deploys must run from protected main; got $GITHUB_REF." >&2
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          main_sha="$(git rev-parse origin/main)"
          if [[ "$GITHUB_SHA" != "$main_sha" ]]; then
            echo "Production deploy SHA must match origin/main. Got $GITHUB_SHA, origin/main is $main_sha." >&2
            exit 1
          fi

          node <<'NODE'
          const fs = require('node:fs');

          const eventName = process.env.GITHUB_EVENT_NAME;
          const ref = process.env.GITHUB_REF;
          const sha = process.env.GITHUB_SHA;
          const repoName = process.env.REPOSITORY_NAME;
          const manifestText = (process.env.RELEASE_MANIFEST || '').trim();

          let deploySource = null;
          if (ref === 'refs/heads/main') {
            deploySource = 'main';
          }

          if (!deploySource) {
            throw new Error(
              `Production deploy is allowed only from protected main. Got event=${eventName}, ref=${ref}.`,
            );
          }

          if (manifestText.length > 0) {
            let manifest;
            try {
              manifest = JSON.parse(manifestText);
            } catch (error) {
              throw new Error(`release_manifest is not valid JSON: ${error.message}`);
            }

            const repoEntry = manifest?.repositories?.[repoName];
            if (!repoEntry?.sha) {
              throw new Error(`release_manifest.repositories.${repoName}.sha is required.`);
            }

            if (repoEntry.sha !== sha) {
              throw new Error(
                `release manifest SHA mismatch for ${repoName}: expected ${sha} but got ${repoEntry.sha}.`,
              );
            }

            deploySource = 'main-release-manifest';
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `deploy_source=${deploySource}\n`);
          console.log(`Deployment source accepted: ${deploySource}`);
          NODE

  validate:
    name: validate
    needs: deploy-source-gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reject vulnerable production dependencies
        run: npm audit --omit=dev --audit-level=low

      - name: Validate deploy bundle
        run: npm run typecheck && npm run build:bundle

      - name: Upload validated build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-dist
          path: dist
          if-no-files-found: error

  deploy:
    name: deploy
    needs:
      - deploy-source-gate
      - validate
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download validated build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: dist

      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [[ -z "$VPS_SSH_KEY" || -z "$VPS_SSH_KNOWN_HOSTS" ]]; then
            echo "VPS_SSH_KEY and VPS_SSH_KNOWN_HOSTS must both be configured." >&2
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Backup existing VPS web deployment
        shell: bash
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" <<'EOF'
          set -euo pipefail
          backup_root=/opt/pm-backups/web
          timestamp=$(date -u +%Y%m%dT%H%M%SZ)
          mkdir -p "$backup_root"

          if [ -d /opt/pm-web ]; then
            tar -czf "$backup_root/pm-web-${timestamp}.tgz" -C /opt pm-web
            echo "Created backup: $backup_root/pm-web-${timestamp}.tgz"
          else
            echo "No existing /opt/pm-web directory found; skipping backup tarball."
          fi

          ls -1t "$backup_root" 2>/dev/null | tail -n +16 | while read -r file; do
            rm -f "$backup_root/$file"
          done
          EOF

      - name: Ensure remote directories exist
        shell: bash
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "mkdir -p ${REMOTE_PATH}/site ${REMOTE_PATH}/deploy"

      - name: Sync static bundle to VPS
        shell: bash
        run: |
          rsync -az --delete ./dist/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${REMOTE_PATH}/site/"

      - name: Upload nginx config
        shell: bash
        run: |
          scp deploy/pm-web.nginx.conf "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${REMOTE_PATH}/deploy/pm-web.nginx.conf"

      - name: Configure nginx on VPS
        shell: bash
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" <<'EOF'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          if ! command -v nginx >/dev/null 2>&1; then
            apt-get update
            apt-get install -y nginx
            systemctl enable nginx
          fi
          cp /opt/pm-web/deploy/pm-web.nginx.conf /etc/nginx/sites-available/pm-web
          ln -sfn /etc/nginx/sites-available/pm-web /etc/nginx/sites-enabled/pm-web
          rm -f /etc/nginx/sites-enabled/default
          nginx -t
          systemctl reload nginx || systemctl restart nginx
          for attempt in $(seq 1 10); do
            if curl --fail --silent http://127.0.0.1/ > /dev/null \
              && curl --fail --silent http://127.0.0.1/health > /dev/null \
              && curl --fail --silent --resolve meco-pm.duckdns.org:443:127.0.0.1 https://meco-pm.duckdns.org/health > /dev/null; then
              echo "Web checks passed."
              exit 0
            fi
            echo "Waiting for nginx routes (${attempt}/10)..."
            sleep 2
          done
          echo "Web checks never passed."
          curl -i http://127.0.0.1/ || true
          echo "---"
          curl -i http://127.0.0.1/health || true
          echo "---"
          curl -i --resolve meco-pm.duckdns.org:443:127.0.0.1 https://meco-pm.duckdns.org/health || true
          echo "---"
          nginx -T || true
          echo "---"
          tail -n 200 /var/log/nginx/error.log || true
          exit 1
          EOF
