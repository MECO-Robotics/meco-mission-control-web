name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - development
      - staging
      - "staging/**"
      - main
  push:
    branches:
      - development
      - staging
      - "staging/**"
      - main
    paths:
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - ".github/workflows/ci.yml"
      - ".github/workflows/merge-requirements.yml"
      - ".github/workflows/deploy-vps.yml"
      - ".nvmrc"
      - "deploy/**"
      - "docs/**"
      - "README.md"
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.js"
      - "tsconfig.json"
      - "tsconfig.app.json"
      - "tsconfig.node.json"
      - "vite.config.ts"
      - "jest.config.cjs"
      - "scripts/**"
      - ".env.production.example"

permissions:
  contents: read

concurrency:
  group: meco-mission-control-web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-model:
    name: branch-model
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR branch strategy
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          if [[ "$BASE_REF" == "development" ]]; then
            if [[ "$HEAD_REF" =~ ^(feature|fix|hotfix)/ ]]; then
              exit 0
            fi
            echo "PRs into development must come from feature/*, fix/*, or hotfix/* branches." >&2
            exit 1
          fi

          if [[ "$BASE_REF" == "staging" || "$BASE_REF" =~ ^staging/ ]]; then
            if [[ "$HEAD_REF" == "development" || "$HEAD_REF" =~ ^(fix|hotfix)/ ]]; then
              exit 0
            fi
            echo "PRs into staging must come from development, fix/*, or hotfix/* branches." >&2
            exit 1
          fi

          if [[ "$BASE_REF" == "main" ]]; then
            if [[ "$HEAD_REF" == "development" || "$HEAD_REF" == "staging" || "$HEAD_REF" =~ ^staging/ || "$HEAD_REF" =~ ^hotfix/ ]]; then
              exit 0
            fi
            echo "PRs into main must come from staging, staging/*, development, or hotfix/* branches." >&2
            exit 1
          fi

          echo "Unexpected PR base branch: $BASE_REF" >&2
          exit 1

  ci-validate:
    name: ci-validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reject vulnerable dependencies
        run: npm audit --audit-level=low

      - name: Verify
        run: npm run verify

      - name: Upload verified production bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error


  snapshot-validate:
    name: snapshot-validate
    needs: ci-validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Download verified production bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist-${{ github.sha }}
          path: dist

      - name: Build sanitized production-like snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p snapshot
          node <<'NODE'
          const fs = require('node:fs');

          const payload = {
            repository: process.env.GITHUB_REPOSITORY,
            commit: process.env.GITHUB_SHA,
            ref: process.env.GITHUB_REF,
            generatedAtUtc: new Date().toISOString(),
            validations: ['npm run verify'],
            artifacts: ['dist/**', 'deploy/pm-web.nginx.conf', '.env.production.example'],
            deployTarget: 'production-vps',
          };

          fs.writeFileSync('snapshot/manifest.json', `${JSON.stringify(payload, null, 2)}\n`);
          NODE
          tar -czf snapshot/web-production-snapshot.tgz dist deploy/pm-web.nginx.conf .env.production.example package.json package-lock.json snapshot/manifest.json

      - name: Upload sanitized snapshot artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-production-snapshot-${{ github.sha }}
          path: |
            snapshot/manifest.json
            snapshot/web-production-snapshot.tgz
          if-no-files-found: error
