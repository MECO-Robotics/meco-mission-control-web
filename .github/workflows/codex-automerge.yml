name: Codex Auto Merge

on:
  workflow_run:
    workflows:
      - Trusted Merge Requirements
    types:
      - completed
  # Metadata-only trusted event: this workflow never checks out or executes PR code.
  pull_request_target:
    branches:
      - development
      - staging
      - "staging/**"
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  pull_request_review:
    types:
      - submitted
      - edited
      - dismissed

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: codex-automerge-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: true

jobs:
  enable-automerge:
    name: enable-automerge
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge when Codex review and checks are green
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          CODEX_REVIEWER_LOGINS: "chatgpt-codex-connector[bot],chatgpt-codex-connector,codex[bot]"
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            function isTargetBaseRef(baseRef) {
              return baseRef === 'development' || baseRef === 'main' || baseRef === 'staging' || baseRef.startsWith('staging/');
            }
            const requiredStatusContexts = new Set(['merge-requirements']);
            const trustedCodexReviewerLogins = new Set(
              (process.env.CODEX_REVIEWER_LOGINS || '')
                .split(',')
                .map((login) => login.trim().toLowerCase())
                .filter(Boolean)
            );

            if (context.eventName === 'workflow_run') {
              const conclusion = context.payload?.workflow_run?.conclusion;
              if (conclusion !== 'success') {
                core.info(`Skipping because workflow_run conclusion is ${conclusion ?? 'unknown'}.`);
                return;
              }
            }

            const pullRequestNumbers = new Set();
            if (context.payload?.pull_request?.number) {
              pullRequestNumbers.add(context.payload.pull_request.number);
            }
            for (const pr of context.payload?.workflow_run?.pull_requests ?? []) {
              if (pr?.number) {
                pullRequestNumbers.add(pr.number);
              }
            }

            if (context.eventName === 'workflow_run' && pullRequestNumbers.size === 0) {
              const trustedRunId = context.payload?.workflow_run?.id;
              const openPulls = await github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                state: 'open',
                per_page: 100,
              });
              for (const pr of openPulls) {
                const { data: combinedStatus } = await github.rest.repos.getCombinedStatusForRef({
                  owner,
                  repo,
                  ref: pr.head.sha,
                  per_page: 100,
                });
                const statusMatchesRun = (combinedStatus.statuses ?? []).some((status) => (
                  status.context === 'merge-requirements'
                    && status.state === 'success'
                    && String(status.target_url ?? '').includes(`/actions/runs/${trustedRunId}`)
                ));
                if (statusMatchesRun) {
                  pullRequestNumbers.add(pr.number);
                }
              }
            }

            if (pullRequestNumbers.size === 0) {
              core.info('No pull request is associated with this event.');
              return;
            }

            async function maybeEnableAutoMerge(pullNumber) {
              const { data: pr } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: pullNumber,
              });

              if (pr.state !== 'open') {
                core.info(`PR #${pullNumber} is ${pr.state}; skipping.`);
                return;
              }

              if (pr.draft) {
                core.info(`PR #${pullNumber} is draft; skipping.`);
                return;
              }

              if (!isTargetBaseRef(pr.base.ref)) {
                core.info(`PR #${pullNumber} targets ${pr.base.ref}; skipping.`);
                return;
              }

              if (pr.auto_merge) {
                core.info(`PR #${pullNumber} already has auto-merge enabled.`);
                return;
              }

              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner,
                repo,
                pull_number: pullNumber,
                per_page: 100,
              });

              reviews.sort((a, b) => {
                return Date.parse(a.submitted_at ?? 0) - Date.parse(b.submitted_at ?? 0);
              });

              const latestReviewByUser = new Map();
              for (const review of reviews) {
                const login = review.user?.login;
                if (!login) {
                  continue;
                }
                latestReviewByUser.set(login, review);
              }

              const latestReviews = [...latestReviewByUser.values()].map((review) => ({
                login: review.user?.login ?? '',
                state: String(review.state ?? '').toUpperCase(),
                commitId: review.commit_id ?? '',
                userType: review.user?.type ?? '',
              }));

              const isTrustedCodexReviewer = (review) => {
                return trustedCodexReviewerLogins.has(review.login.toLowerCase());
              };

              const isHumanReviewer = (review) => {
                return review.userType !== 'Bot' && !review.login.toLowerCase().endsWith('[bot]') && !isTrustedCodexReviewer(review);
              };

              const codexReviewers = latestReviews.filter(isTrustedCodexReviewer);

              if (codexReviewers.length === 0) {
                core.info(`PR #${pullNumber} has no Codex review state yet.`);
                return;
              }

              if (codexReviewers.some((review) => review.state === 'CHANGES_REQUESTED')) {
                core.info(`PR #${pullNumber} has Codex requested changes.`);
                return;
              }

              if (!codexReviewers.some((review) => review.state === 'APPROVED' && review.commitId === pr.head.sha)) {
                core.info(`PR #${pullNumber} has no fresh Codex approval for ${pr.head.sha}.`);
                return;
              }

              const humanReviewers = latestReviews.filter(isHumanReviewer);
              if (humanReviewers.some((review) => review.state === 'CHANGES_REQUESTED')) {
                core.info(`PR #${pullNumber} has human requested changes.`);
                return;
              }

              if (!humanReviewers.some((review) => review.state === 'APPROVED' && review.commitId === pr.head.sha)) {
                core.info(`PR #${pullNumber} has no fresh human approval for ${pr.head.sha}.`);
                return;
              }

              const { data: checkRunsPayload } = await github.rest.checks.listForRef({
                owner,
                repo,
                ref: pr.head.sha,
                filter: 'latest',
                per_page: 100,
              });
              const checkRuns = checkRunsPayload.check_runs ?? [];
              const relevantCheckRuns = checkRuns.filter((checkRun) => {
                const isCurrentRun = String(checkRun.details_url ?? '').includes(
                  `/actions/runs/${context.runId}`,
                );
                return requiredStatusContexts.has(checkRun.name) && !isCurrentRun;
              });
              const { data: statuses } = await github.rest.repos.listCommitStatusesForRef({
                owner,
                repo,
                ref: pr.head.sha,
                per_page: 100,
              });
              const latestStatusByContext = new Map();
              for (const status of statuses) {
                if (requiredStatusContexts.has(status.context) && !latestStatusByContext.has(status.context)) {
                  latestStatusByContext.set(status.context, status);
                }
              }
              const latestCheckByName = new Map();
              for (const checkRun of relevantCheckRuns) {
                const previous = latestCheckByName.get(checkRun.name);
                const currentTime = Date.parse(checkRun.started_at ?? checkRun.completed_at ?? 0);
                const previousTime = Date.parse(previous?.started_at ?? previous?.completed_at ?? 0);
                if (!previous || currentTime >= previousTime) {
                  latestCheckByName.set(checkRun.name, checkRun);
                }
              }

              const blockingContexts = [];
              for (const requiredContext of requiredStatusContexts) {
                const status = latestStatusByContext.get(requiredContext);
                const checkRun = latestCheckByName.get(requiredContext);
                if (status) {
                  if (status.state !== 'success') {
                    blockingContexts.push(`${requiredContext}:status/${status.state}`);
                  }
                  continue;
                }
                if (!checkRun) {
                  blockingContexts.push(`${requiredContext}:missing`);
                  continue;
                }
                if (checkRun.status !== 'completed' || checkRun.conclusion !== 'success') {
                  blockingContexts.push(
                    `${requiredContext}:check/${checkRun.status}/${checkRun.conclusion ?? 'pending'}`,
                  );
                }
              }

              if (blockingContexts.length > 0) {
                core.info(`PR #${pullNumber} still has non-green requirements: ${blockingContexts.join(', ')}.`);
                return;
              }

              const enableAutoMergeMutation = `
                mutation EnableAutoMerge($pullRequestId: ID!) {
                  enablePullRequestAutoMerge(input: { pullRequestId: $pullRequestId, mergeMethod: SQUASH }) {
                    pullRequest {
                      number
                    }
                  }
                }
              `;

              try {
                await github.graphql(enableAutoMergeMutation, {
                  pullRequestId: pr.node_id,
                });
                core.notice(`Enabled auto-merge (squash) for PR #${pullNumber}.`);
              } catch (error) {
                const message = String(error?.message ?? error);
                if (message.includes('already enabled')) {
                  core.info(`PR #${pullNumber} already has auto-merge enabled.`);
                  return;
                }
                core.warning(`Could not enable auto-merge for PR #${pullNumber}: ${message}`);
              }
            }

            for (const pullNumber of pullRequestNumbers) {
              await maybeEnableAutoMerge(pullNumber);
            }
